# Maintained local Semgrep rules for the CodeAlpha SecureCodeReview project.
#
# Policy: any finding in application code (app/) blocks the security gate.
# The intentionally vulnerable files under vulnerable_samples/ and benchmarks/
# are fixtures and are exercised by tests instead of being scanned as
# production code.
rules:
  - id: codealpha.python.subprocess-shell-true
    languages: [python]
    message: >-
      A subprocess is launched with shell=True. If any part of the command is
      attacker-controlled, shell metacharacters can execute arbitrary commands.
      Pass an argument list and leave shell disabled.
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/78.html
    patterns:
      - pattern-either:
          - pattern: subprocess.$FUNC(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
          - pattern: asyncio.create_subprocess_shell(...)

  - id: codealpha.python.pickle-deserialization
    languages: [python]
    message: >-
      Pickle deserialization can execute arbitrary code when the input is
      attacker-controlled. Use a constrained format such as JSON and validate
      its schema.
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      references:
        - https://cwe.mitre.org/data/definitions/502.html
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: dill.loads(...)
          - pattern: dill.load(...)

  - id: codealpha.python.dynamic-code-execution
    languages: [python]
    message: >-
      Dynamic code execution (eval/exec) can turn data into executable code.
      Avoid it for untrusted input and use a constrained parser or dispatch
      table instead.
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/95.html
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: codealpha.python.sql-string-construction
    languages: [python]
    message: >-
      SQL is constructed by concatenating or formatting data into a query.
      Use parameter binding (for example "WHERE name = ?") so data is never
      parsed as SQL syntax.
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/89.html
    patterns:
      - pattern-either:
          - pattern: $DB.execute($QUERY, ...)
          - pattern: $DB.executemany($QUERY, ...)
      - metavariable-pattern:
          metavariable: $QUERY
          patterns:
            - pattern-either:
                - pattern: f"..."
                - pattern: '"..." + $X'
                - pattern: '"...".format(...)'
                - pattern: '"..." % $X'

  - id: codealpha.python.unsafe-yaml-load
    languages: [python]
    message: >-
      yaml.load can construct arbitrary Python objects. Use yaml.safe_load or
      an explicit safe Loader for untrusted YAML.
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      references:
        - https://cwe.mitre.org/data/definitions/502.html
    patterns:
      - pattern: yaml.load($DATA, ...)
      - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load($DATA, Loader=yaml.CSafeLoader, ...)
      - pattern-not: yaml.load($DATA, Loader=yaml.BaseLoader, ...)
      - pattern-not: yaml.load($DATA, Loader=yaml.CLoader, ...)
      - pattern-not: yaml.load($DATA, Loader=SafeLoader, ...)
      - pattern-not: yaml.load($DATA, Loader=CSafeLoader, ...)
      - pattern-not: yaml.load($DATA, Loader=BaseLoader, ...)
      - pattern-not: yaml.load($DATA, Loader=CLoader, ...)

  - id: codealpha.python.disabled-tls-verification
    languages: [python]
    message: >-
      TLS certificate verification is disabled. This permits man-in-the-middle
      attacks; verify certificates and provide a trusted CA bundle if needed.
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-295: Improper Certificate Validation"
      owasp: "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/295.html
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)

  - id: codealpha.python.insecure-tempfile
    languages: [python]
    message: >-
      tempfile.mktemp has a race condition between name generation and file
      creation. Use tempfile.NamedTemporaryFile or tempfile.mkstemp.
    severity: WARNING
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-377: Insecure Temporary File"
      owasp: "A01:2021 - Broken Access Control"
      references:
        - https://cwe.mitre.org/data/definitions/377.html
    pattern: tempfile.mktemp(...)

  - id: codealpha.python.hardcoded-secret
    languages: [python]
    message: >-
      A credential-like value is assigned as a string literal. Load secrets
      from a managed configuration source and rotate any value committed to
      source control.
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    pattern-regex: >-
      (?i)(password|passwd|secret|api_?key|token|access_?key|private_?key)[A-Za-z0-9_]*\s*=\s*["'][^"']{4,}["']
